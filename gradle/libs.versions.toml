[versions]
# agp/compileSdk/targetSdk (see app/build.gradle.kts) were bumped together, deliberately, to
# match what navigation-compose 2.10.0 / compose-bom 2026.08.00 actually require — not guessed:
# these are the exact versions the reporter's own Android Studio resolved and reported requiring
# AGP 9.1.0 and compileSdk 37 in a real "checkDebugAarMetadata" failure.
agp = "9.1.0"
# Bumped together, in lockstep, alongside the AGP jump above: Kotlin 2.0.21 is what caused
# "Cannot add extension with name 'kotlin'" when applying org.jetbrains.kotlin.android against
# AGP 9.1.0 — a genuine incompatibility, not a config error, since Kotlin 2.0.21 predates AGP 9
# by a long way. KSP's own versioning scheme changed too: from Kotlin 2.3 onward it no longer
# embeds the Kotlin version in its own version string, so it isn't literally "2.3.21-x.y.z"
# anymore — 2.3.11 is KSP's own current release for this Kotlin line.
kotlin = "2.3.21"
ksp = "2.3.11"
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
navigationCompose = "2.10.0"
# Hilt's Gradle plugin only gained AGP 9 support starting at 2.59 (2.52 fails hard with "Android
# BaseExtension not found" against AGP 9 — confirmed via google/dagger issues #4944/#5083). 2.59
# itself shipped a broken ComponentTreeDeps runtime artifact for AGP 9 (issue #5099); 2.60.1 is
# the latest release on Maven Central and includes the follow-up fixes, so used here rather than
# 2.59 itself. hilt-android/-compiler are confirmed to exist at 2.60.1 on Maven Central.
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
# 2.6.1's KSP annotation processor hits a genuine KSP2 bug ("unexpected jvm signature V" on
# suspend DAO methods returning Unit — confirmed via google/ksp#2177/#2957) against our
# Kotlin 2.3.21/KSP 2.3.11. Fixed upstream in Room; bumped to the latest stable release,
# 2.8.4 (confirmed via developer.android.com/jetpack/androidx/releases/room). Room 2.8.0 raised
# its own minSdk floor to 23, well under our minSdk 26, so no further bump needed there.
room = "2.8.4"
coroutines = "1.9.0"
biometric = "1.1.0"
fragmentKtx = "1.8.3"
sqlcipher = "4.18.0"
junit5 = "5.11.0"
# Platform artifacts version independently of Jupiter (5.11.0 <-> platform 1.11.0) — Gradle 9
# stopped putting the launcher on the test classpath implicitly, so it must be declared.
junitPlatformLauncher = "1.11.0"
# kotlinx-serialization-json versions independently of Kotlin itself (confirmed via
# kotlinlang.org/docs/serialization.html); 1.11.0 is the latest stable on Maven Central. The
# plugin.serialization Gradle plugin, unlike the runtime library, is a Kotlin compiler plugin and
# stays pinned to the Kotlin version itself, same as plugin.compose already is in this file.
kotlinxSerializationJson = "1.11.0"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
junit5-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit5" }
junit5-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit5" }
junit5-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit5" }
junit5-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatformLauncher" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android entry: AGP 9.0+ has built-in Kotlin support and fails the build if that
# plugin is applied on top of it. android.application alone now compiles :app's Kotlin sources.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
